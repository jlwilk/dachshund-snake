<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ead8">
  <title>Dachshund Snake</title>
  <meta name="description" content="Snake, but you're a dachshund — and the pup only ever gets longer.">
  <meta property="og:title" content="Dachshund Snake">
  <meta property="og:description" content="Snake, but you're a dachshund — and the pup only ever gets longer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jlwilk.github.io/dachshund-snake/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%AD%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6ead8;
      --ink: #4a2a14;
      --panel: #fffaf2;
      --button: #e9d3b5;
      --button-press: #d9bd97;
      --shadow: 0 6px 24px rgb(74 42 20 / 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241912;
        --ink: #f6ead8;
        --panel: #3a2a1e;
        --button: #5a4130;
        --button-press: #6d5039;
        --shadow: 0 6px 24px rgb(0 0 0 / 0.4);
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      box-sizing: border-box;
      height: 100vh;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "hud" "stage" "dpad";
      gap: 12px;
    }
    .hud { grid-area: hud; display: flex; align-items: center; gap: 16px; font-weight: 600; }
    .hud b { font-size: 1.25rem; }
    .hud .spacer { flex: 1; }
    button {
      font: inherit;
      color: var(--ink);
      background: var(--button);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { background: var(--button-press); }
    button:disabled { opacity: 0.4; cursor: default; }
    #pause { width: 44px; height: 44px; font-size: 1rem; }
    .stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; touch-action: none; }
    #board {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .overlay[hidden] { display: none; }
    .card {
      max-width: min(80%, 360px);
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .card h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .card p { margin: 6px 0; line-height: 1.4; }
    .card .hint { opacity: 0.75; font-size: 0.9rem; }
    .picker { pointer-events: auto; margin: 10px 0 4px; }
    #preview { display: block; width: 160px; height: 56px; margin: 0 auto 8px; border-radius: 10px; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0; }
    .chips button {
      min-height: 32px;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      border: 2px solid transparent;
    }
    .chips button[aria-checked="true"] {
      background: var(--button-press);
      border-color: var(--ink);
      font-weight: 700;
    }
    .dpad {
      grid-area: dpad;
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 64px);
      gap: 8px;
      justify-content: center;
      touch-action: none;
    }
    .dpad button { font-size: 1.5rem; }
    .dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .dpad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }
    @media (pointer: coarse) {
      .dpad { display: grid; }
    }
    /* Narrow phones: keep each chip row on one line so the card fits the board. */
    @media (max-width: 480px) {
      .card { max-width: min(92%, 360px); padding: 12px 12px; }
      .card h1 { margin-bottom: 4px; font-size: 1.3rem; }
      .card p { margin: 4px 0; font-size: 0.9rem; }
      .card .hint { font-size: 0.8rem; }
      .picker { margin: 6px 0 2px; }
      #preview { margin-bottom: 6px; }
      .chips { gap: 4px; margin: 4px 0; }
      .chips button { padding: 2px 9px; font-size: 0.78rem; white-space: nowrap; }
    }
    @media (pointer: coarse) and (orientation: landscape) {
      .app {
        max-width: none;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "hud hud" "stage dpad";
      }
      .dpad { align-content: center; }
      .card { max-width: 260px; padding: 12px 16px; }
      .card h1 { margin-bottom: 4px; font-size: 1.25rem; }
      .card p { margin: 4px 0; font-size: 0.85rem; }
      .picker { margin: 6px 0 2px; }
      #preview { width: 120px; height: 42px; margin-bottom: 4px; }
      .chips { gap: 4px; margin: 4px 0; }
      .chips button { min-height: 28px; padding: 2px 8px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hud">
      <div>Score <b id="score">0</b></div>
      <div><span id="best-label">Best</span> <b id="best">0</b></div>
      <div class="spacer"></div>
      <button id="pause" type="button" aria-label="Pause">❚❚</button>
    </header>
    <div class="stage" id="stage">
      <canvas id="board" aria-label="Game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h1 id="title">Dachshund Snake</h1>
          <p id="message"></p>
          <div class="picker" id="picker">
            <canvas id="preview" aria-hidden="true"></canvas>
            <div class="chips" role="radiogroup" aria-label="Color" data-kind="color"></div>
            <div class="chips" role="radiogroup" aria-label="Coat" data-kind="coat"></div>
            <div class="chips" role="radiogroup" aria-label="Mode" data-kind="mode"></div>
          </div>
          <p class="hint" id="hint"></p>
        </div>
      </div>
    </div>
    <nav class="dpad" id="dpad" aria-label="Direction controls">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </nav>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
